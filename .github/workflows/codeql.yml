name: codeql

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '23 4 * * 1'

jobs:
  analyze:
    runs-on: windows-latest
    permissions:
      security-events: write
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 8.0.x
      - uses: github/codeql-action/init@v3
        with:
          languages: csharp
          build-mode: manual
      # Same SDK-style-only build as build.yml; SeriLogNetFrameWork is not SDK-style.
      - name: Build SDK-style projects
        shell: bash
        run: |
          for p in $(git ls-files '*.csproj' | grep -v SeriLogNetFrameWork); do
            dotnet build "$p" --configuration Release || exit 1
          done
      - uses: github/codeql-action/analyze@v3
